<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Krishi Sathi - Farmer Advisory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      .centered-mic {
        width: 110px;
        height: 110px;
        background: #c0b283;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 24px auto;
        box-shadow: 0 3px 12px #c0b28333;
        cursor: pointer;
      }

      .sidebar-visible {
        transform: translateX(0) !important;
      }
    </style>
  </head>

  <body class="bg-green-50 min-h-screen flex items-center justify-center p-4">
    <!-- Sidebar container -->
    <div
      id="sidebar"
      class="fixed top-0 left-0 h-full w-64 bg-green-800 text-white shadow-lg z-30 transform -translate-x-64 transition-transform duration-300"
    >
      <div class="p-4 font-bold text-xl border-b border-green-700">
        Krishi Sathi
      </div>
      <nav class="flex flex-col space-y-4 p-4 text-left text-lg">
        <button
          id="tab-weather"
          class="hover:bg-green-700 rounded p-2 text-left"
        >
          🌤 Weather
        </button>
        <button id="tab-pest" class="hover:bg-green-700 rounded p-2 text-left">
          🐛 Pest/Disease
        </button>
        <button id="tab-soil" class="hover:bg-green-700 rounded p-2 text-left">
          🌱 Soil Health
        </button>
        <button
          id="tab-schemes"
          class="hover:bg-green-700 rounded p-2 text-left"
        >
          🏛 Sarkari Schemes
        </button>
        <button
          id="tab-portfolio"
          class="hover:bg-green-700 rounded p-2 text-left"
        >
          📊 Smart Portfolio
        </button>
        <button
          id="tab-specialist"
          class="hover:bg-green-700 rounded p-2 text-left"
        >
          📞 Mandi
        </button>
      </nav>
      <button
        id="sidebar-close"
        class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center border border-white rounded-full hover:bg-green-700"
      >
        &times;
      </button>
    </div>

    <!-- Sidebar open button -->
    <button
      id="sidebar-open"
      class="fixed top-4 left-4 p-2 rounded bg-green-700 text-white z-40 shadow-lg hover:bg-green-800"
    >
      &#9776;
    </button>

    <!-- Main app UI wrapper -->
    <div
      id="main-content"
      class="p-6 transition-all duration-300 max-w-md w-full bg-white rounded-2xl shadow-lg"
    >
      <!-- Language Toggle -->
      <div class="w-full flex justify-end mb-3">
        <label
          for="lang-toggle"
          class="text-green-700 font-semibold mr-2 self-center"
          >Language:</label
        >
        <select
          id="lang-toggle"
          class="rounded border border-green-400 px-2 py-1"
        >
          <option value="en">English</option>
          <option value="hi">Hindi : हिन्दी</option>
          <option value="pa">Punjabi : ਪੰਜਾਬੀ</option>
        </select>
      </div>

      <!-- Weather Section -->
      <section
        id="weather-container"
        class="hidden bg-green-100 p-4 rounded-xl mb-6"
      >
        <h2 class="text-xl font-semibold mb-2 text-green-900">
          Current Weather
        </h2>
        <div id="weather-info" class="text-green-800 text-base"></div>
      </section>

      <!-- Sarkari Schemes Section -->
      <section
        id="schemes-container"
        class="hidden bg-green-100 p-4 rounded-xl mb-6"
      >
        <h2 class="text-xl font-semibold mb-3 text-green-900">
          Latest Government Schemes for Farmers
        </h2>
        <ul
          id="schemes-list"
          class="list-disc pl-6 space-y-2 text-green-900"
        ></ul>
      </section>

      <!-- Voice & Advisory Section -->
      <div class="text-center mb-3 font-semibold text-lg text-green-800">
        Tap and talk to me,<br />
        your Krishi Sathi
      </div>

      <button id="start-voice-btn-ui" class="centered-mic" title="Tap to talk">
        <span class="material-icons text-white text-5xl select-none">mic</span>
      </button>

      <p id="voice-status-ui" class="text-green-700 font-semibold mb-4 hidden">
        Listening...
      </p>

      <!-- Image Upload -->
      <input
        type="file"
        accept="image/*"
        id="image-upload"
        class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-100 file:text-green-800 hover:file:bg-green-200 mb-4"
      />

      <!-- Camera Capture -->
      <button
        id="open-camera-btn"
        class="w-full bg-green-600 hover:bg-green-700 text-white rounded-xl py-2 mb-4 shadow"
        type="button"
      >
        📷 Capture Image from Camera
      </button>

      <!-- Camera Container -->
      <div
        id="camera-container"
        class="w-full hidden flex flex-col items-center mb-4"
      >
        <video
          id="camera-video"
          autoplay
          playsinline
          class="w-full rounded-xl border-4 border-green-300 mb-3"
          style="aspect-ratio: 4 / 3"
        ></video>
        <div class="flex space-x-4 w-full justify-center">
          <button
            id="capture-photo-btn"
            class="bg-green-600 hover:bg-green-700 text-white rounded-xl py-2 px-8 shadow"
            type="button"
          >
            📸 Capture Photo
          </button>
          <button
            id="close-camera-btn"
            class="bg-gray-400 hover:bg-gray-500 text-white rounded-xl py-2 px-8 shadow"
            type="button"
          >
            ✖ Close Camera
          </button>
        </div>
      </div>

      <!-- Image Preview -->
      <div
        class="w-full h-40 bg-white border-4 border-dashed border-green-200 rounded-xl flex items-center justify-center relative mb-4"
      >
        <img
          id="image-preview"
          alt="Image Preview"
          class="max-h-full max-w-full rounded-xl hidden"
        />
        <span id="preview-placeholder" class="text-green-400 italic select-none"
          >Image Preview Area</span
        >
      </div>

      <!-- User Query -->
      <textarea
        id="user-query"
        rows="4"
        placeholder="Describe the issue or ask a question here..."
        class="w-full rounded-xl border-2 border-green-300 focus:outline-none focus:border-green-600 p-3 text-green-900 font-medium mb-4"
      ></textarea>

      <!-- Diagnose Button -->
      <button
        id="diagnose-button"
        class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 rounded-xl flex justify-center items-center"
        type="button"
      >
        <span id="button-text">Get Expert Diagnosis</span>
        <svg
          id="loading-indicator"
          class="animate-spin ml-3 h-6 w-6 text-white hidden"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
          ></path>
        </svg>
      </button>

      <!-- Error Message -->
      <p id="error-message" class="mt-4 text-red-600 font-semibold hidden"></p>

      <!-- Diagnosis Result Section -->
      <section
        id="diagnosis-result"
        class="mt-6 bg-green-100 p-4 rounded-xl text-green-900 text-sm whitespace-pre-line tracking-tight shadow-inner max-h-64 overflow-y-auto"
        aria-live="polite"
      >
        Your agricultural advice will appear here after the analysis.
      </section>

      <!-- Speak Button -->
      <button
        id="speak-response-btn"
        disabled
        class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-xl"
        type="button"
      >
        🔈 Speak Diagnosis
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
